name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: asl_erp
          MYSQL_USER: asl
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: rootsecret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootsecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, gd, intl, mbstring, mysql, sqlite, xml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run tests
        run: php artisan test

      - name: Audit Composer dependencies
        run: composer audit

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Install MySQL client and zip
        run: sudo apt-get update && sudo apt-get install -y mysql-client zip

      - name: Prove the MySQL schema and write the deployment SQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: asl_erp
          DB_USERNAME: asl
          DB_PASSWORD: secret
          APP_KEY: base64:s4p1vC2m0mN8oYk3qQh1wE7rT6uI5oP4aS3dF2gH1jK=
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction
          php artisan asl:export-access-sql
          php artisan asl:export-company-sql
          php artisan asl:export-parties-sql
          git diff --exit-code -- deploy/reference-data.sql deploy/company-reference-data.sql deploy/upgrade-company-module.sql deploy/upgrade-parties-module.sql
          cat > /tmp/mysql-client.cnf <<'EOF'
          [client]
          host=127.0.0.1
          port=3306
          user=asl
          password=secret
          EOF
          chmod 600 /tmp/mysql-client.cnf
          {
            echo "-- Generated by CI from the committed migrations."
            echo "-- Review before importing into phpMyAdmin. This file has no business data."
            echo "-- The migrations table is included so a later artisan migrate does not repeat this schema."
            mysqldump --defaults-extra-file=/tmp/mysql-client.cnf --no-tablespaces --skip-lock-tables --no-data asl_erp
            mysqldump --defaults-extra-file=/tmp/mysql-client.cnf --no-tablespaces --skip-lock-tables --no-create-info asl_erp migrations
          } > deploy/mysql-schema.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-company-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-parties-module.sql
          categories=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM document_categories" asl_erp)
          test "$categories" = "20"
          party_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Parties'" asl_erp)
          test "$party_permissions" = "10"
          sales_suppliers=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='suppliers.view'" asl_erp)
          test "$sales_suppliers" = "0"
          mysql -h 127.0.0.1 -P 3306 -uroot -prootsecret -e "CREATE DATABASE IF NOT EXISTS asl_upgrade CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON asl_upgrade.* TO 'asl'@'%'; FLUSH PRIVILEGES;"
          for path in database/migrations/*.php; do
            case "$(basename "$path")" in
              *party*) continue ;;
            esac
            DB_DATABASE=asl_upgrade php artisan migrate --force --no-interaction --path="$path"
          done
          DB_DATABASE=asl_upgrade php artisan db:seed --force --no-interaction
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade <<'SQL'
          DELETE FROM permission_role WHERE permission_id IN (SELECT id FROM (SELECT id FROM permissions WHERE permission_group = 'Parties') AS party_permissions);
          DELETE FROM permissions WHERE permission_group = 'Parties';
          SQL
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-parties-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-parties-module.sql
          upgraded=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE slug='parties.view'" asl_upgrade)
          test "$upgraded" = "1"
          upgraded_sales=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='customers.view'" asl_upgrade)
          test "$upgraded_sales" = "1"
          upgraded_blocked=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='suppliers.view'" asl_upgrade)
          test "$upgraded_blocked" = "0"
          DB_DATABASE=asl_upgrade php artisan migrate --force --no-interaction
          rm -f /tmp/mysql-client.cnf

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Build the cPanel package
        run: |
          chmod +x scripts/build-deploy-package.sh
          scripts/build-deploy-package.sh "${GITHUB_SHA}"

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: ahmad-solution-erp-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
