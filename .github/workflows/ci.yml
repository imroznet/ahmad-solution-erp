name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: asl_erp
          MYSQL_USER: asl
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: rootsecret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootsecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, gd, intl, mbstring, mysql, sqlite, xml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run tests
        run: php artisan test

      - name: Audit Composer dependencies
        run: composer audit

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Install MySQL client and zip
        run: sudo apt-get update && sudo apt-get install -y mysql-client zip

      - name: Prove the MySQL schema and write the deployment SQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: asl_erp
          DB_USERNAME: asl
          DB_PASSWORD: secret
          APP_KEY: base64:s4p1vC2m0mN8oYk3qQh1wE7rT6uI5oP4aS3dF2gH1jK=
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction
          php artisan asl:export-access-sql
          php artisan asl:export-company-sql
          php artisan asl:export-parties-sql
          php artisan asl:export-quotations-sql
          php artisan asl:export-delivery-documents-sql
          php artisan asl:export-tax-sql
          git diff --exit-code -- deploy/reference-data.sql deploy/company-reference-data.sql deploy/upgrade-company-module.sql deploy/upgrade-parties-module.sql deploy/upgrade-quotations-module.sql deploy/upgrade-delivery-documents-module.sql deploy/upgrade-tax-module.sql
          cat > /tmp/mysql-client.cnf <<'EOF'
          [client]
          host=127.0.0.1
          port=3306
          user=asl
          password=secret
          EOF
          chmod 600 /tmp/mysql-client.cnf
          {
            echo "-- Generated by CI from the committed migrations."
            echo "-- Review before importing into phpMyAdmin. This file has no business data."
            echo "-- The migrations table is included so a later artisan migrate does not repeat this schema."
            mysqldump --defaults-extra-file=/tmp/mysql-client.cnf --no-tablespaces --skip-lock-tables --no-data asl_erp
            mysqldump --defaults-extra-file=/tmp/mysql-client.cnf --no-tablespaces --skip-lock-tables --no-create-info asl_erp migrations
          } > deploy/mysql-schema.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-company-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-parties-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-quotations-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-quotations-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-delivery-documents-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-delivery-documents-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-tax-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-tax-module.sql
          categories=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM document_categories" asl_erp)
          test "$categories" = "20"
          party_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Parties'" asl_erp)
          test "$party_permissions" = "10"
          sales_suppliers=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='suppliers.view'" asl_erp)
          test "$sales_suppliers" = "0"
          quotation_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Quotations'" asl_erp)
          test "$quotation_permissions" = "9"
          challan_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Challans'" asl_erp)
          test "$challan_permissions" = "8"
          invoice_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Invoices'" asl_erp)
          test "$invoice_permissions" = "6"
          tax_rules=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Tax rules'" asl_erp)
          test "$tax_rules" = "5"
          mushak_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Mushak'" asl_erp)
          test "$mushak_permissions" = "6"
          vds_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='VDS'" asl_erp)
          test "$vds_permissions" = "4"
          ait_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='AIT'" asl_erp)
          test "$ait_permissions" = "4"
          mysql -h 127.0.0.1 -P 3306 -uroot -prootsecret -e "CREATE DATABASE IF NOT EXISTS asl_upgrade CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON asl_upgrade.* TO 'asl'@'%'; FLUSH PRIVILEGES;"
          for path in database/migrations/*.php; do
            case "$(basename "$path")" in
              *party*|*quotation*|*delivery_document*|*tax*) continue ;;
            esac
            DB_DATABASE=asl_upgrade php artisan migrate --force --no-interaction --path="$path"
          done
          DB_DATABASE=asl_upgrade php artisan db:seed --force --no-interaction
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade <<'SQL'
          DELETE FROM permission_role WHERE permission_id IN (SELECT id FROM (SELECT id FROM permissions WHERE permission_group = 'Parties') AS party_permissions);
          DELETE FROM permissions WHERE permission_group = 'Parties';
          SQL
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-parties-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-parties-module.sql
          upgraded=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE slug='parties.view'" asl_upgrade)
          test "$upgraded" = "1"
          upgraded_sales=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='customers.view'" asl_upgrade)
          test "$upgraded_sales" = "1"
          upgraded_blocked=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='suppliers.view'" asl_upgrade)
          test "$upgraded_blocked" = "0"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade <<'SQL'
          DELETE FROM permission_role WHERE permission_id IN (SELECT id FROM (SELECT id FROM permissions WHERE permission_group = 'Quotations') AS quotation_permissions);
          DELETE FROM permissions WHERE permission_group = 'Quotations';
          SQL
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-quotations-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-quotations-module.sql
          upgraded_quotations=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE slug='quotations.view'" asl_upgrade)
          test "$upgraded_quotations" = "1"
          upgraded_quotation_group=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Quotations'" asl_upgrade)
          test "$upgraded_quotation_group" = "9"
          upgraded_sales_quotes=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='quotations.view'" asl_upgrade)
          test "$upgraded_sales_quotes" = "1"
          upgraded_sales_approve=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='quotations.approve'" asl_upgrade)
          test "$upgraded_sales_approve" = "0"
          upgraded_documents=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='document-manager' AND p.slug='quotations.view'" asl_upgrade)
          test "$upgraded_documents" = "0"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade <<'SQL'
          DELETE FROM permission_role WHERE permission_id IN (SELECT id FROM (SELECT id FROM permissions WHERE permission_group IN ('Challans', 'Invoices')) AS document_permissions);
          DELETE FROM permissions WHERE permission_group IN ('Challans', 'Invoices');
          SQL
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-delivery-documents-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-delivery-documents-module.sql
          upgraded_challans=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Challans'" asl_upgrade)
          test "$upgraded_challans" = "8"
          upgraded_invoices=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Invoices'" asl_upgrade)
          test "$upgraded_invoices" = "6"
          upgraded_sales_challans=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='challans.view'" asl_upgrade)
          test "$upgraded_sales_challans" = "1"
          upgraded_sales_void=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='challans.void'" asl_upgrade)
          test "$upgraded_sales_void" = "0"
          upgraded_document_manager=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='document-manager' AND p.permission_group IN ('Challans', 'Invoices')" asl_upgrade)
          test "$upgraded_document_manager" = "0"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade <<'SQL'
          DELETE FROM permission_role WHERE permission_id IN (SELECT id FROM (SELECT id FROM permissions WHERE permission_group IN ('Tax rules', 'Mushak', 'VDS', 'AIT')) AS tax_permissions);
          DELETE FROM permissions WHERE permission_group IN ('Tax rules', 'Mushak', 'VDS', 'AIT');
          SQL
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-tax-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-tax-module.sql
          upgraded_tax=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group IN ('Tax rules', 'Mushak', 'VDS', 'AIT')" asl_upgrade)
          test "$upgraded_tax" = "19"
          upgraded_sales_mushak=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='mushak.view'" asl_upgrade)
          test "$upgraded_sales_mushak" = "1"
          upgraded_sales_mushak_void=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='mushak.void'" asl_upgrade)
          test "$upgraded_sales_mushak_void" = "0"
          upgraded_accountant_approve=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='accountant' AND p.slug='tax_rules.approve'" asl_upgrade)
          test "$upgraded_accountant_approve" = "0"
          upgraded_tax_tables=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='asl_upgrade' AND TABLE_NAME='mushak_invoices'" )
          test "$upgraded_tax_tables" = "1"
          DB_DATABASE=asl_upgrade php artisan migrate --force --no-interaction
          mysql -h 127.0.0.1 -P 3306 -uroot -prootsecret -e "CREATE DATABASE IF NOT EXISTS asl_line_history CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON asl_line_history.* TO 'asl'@'%'; FLUSH PRIVILEGES;"
          for path in database/migrations/*.php; do
            case "$(basename "$path")" in
              *100003*) continue ;;
            esac
            DB_DATABASE=asl_line_history php artisan migrate --force --no-interaction --path="$path"
          done
          DB_DATABASE=asl_line_history php artisan db:seed --force --no-interaction
          history_before=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='asl_line_history' AND TABLE_NAME='delivery_challan_lines' AND COLUMN_NAME='superseded_at'" )
          test "$history_before" = "0"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_line_history < deploy/upgrade-delivery-documents-module.sql
          history_after=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='asl_line_history' AND TABLE_NAME='delivery_challan_lines' AND COLUMN_NAME='superseded_at'" )
          test "$history_after" = "1"
          invoice_history=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='asl_line_history' AND TABLE_NAME='commercial_invoice_lines' AND INDEX_NAME='commercial_invoice_lines_current_challan_unique' AND SEQ_IN_INDEX=1" )
          test "$invoice_history" = "1"
          old_challan_index=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='asl_line_history' AND TABLE_NAME='delivery_challan_lines' AND INDEX_NAME='delivery_challan_lines_challan_position_unique'" )
          test "$old_challan_index" = "0"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_line_history <<'SQL'
          DELETE FROM permission_role WHERE role_id = (SELECT id FROM roles WHERE slug = 'sales-executive') AND permission_id = (SELECT id FROM permissions WHERE slug = 'challans.view');
          INSERT INTO permission_role (role_id, permission_id)
          SELECT r.id, p.id FROM roles r JOIN permissions p ON p.slug = 'challans.view' WHERE r.slug = 'document-manager';
          SQL
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_line_history < deploy/upgrade-delivery-documents-module.sql
          history_sales=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='challans.view'" asl_line_history)
          test "$history_sales" = "1"
          history_custom=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='document-manager' AND p.slug='challans.view'" asl_line_history)
          test "$history_custom" = "1"
          history_migration=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM migrations WHERE migration='2026_11_07_100003_preserve_delivery_document_line_history'" asl_line_history)
          test "$history_migration" = "1"
          mysql -h 127.0.0.1 -P 3306 -uroot -prootsecret -e "CREATE DATABASE IF NOT EXISTS asl_quotation_lock CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS asl_quotation_year CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS asl_quotation_totals CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS asl_document_year CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS asl_document_quantity_lock CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON asl_quotation_lock.* TO 'asl'@'%'; GRANT ALL PRIVILEGES ON asl_quotation_year.* TO 'asl'@'%'; GRANT ALL PRIVILEGES ON asl_quotation_totals.* TO 'asl'@'%'; GRANT ALL PRIVILEGES ON asl_document_year.* TO 'asl'@'%'; GRANT ALL PRIVILEGES ON asl_document_quantity_lock.* TO 'asl'@'%'; FLUSH PRIVILEGES;"
          DB_DATABASE=asl_quotation_lock php scripts/check-quotation-number-lock.php
          DB_DATABASE=asl_quotation_year php scripts/check-quotation-new-year-lock.php
          DB_DATABASE=asl_quotation_totals php scripts/check-quotation-total-bounds.php
          DB_DATABASE=asl_document_year php scripts/check-document-new-year-lock.php
          DB_DATABASE=asl_document_quantity_lock php scripts/check-document-quantity-lock.php
          rm -f /tmp/mysql-client.cnf

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Build the cPanel package
        run: |
          chmod +x scripts/build-deploy-package.sh
          scripts/build-deploy-package.sh "${GITHUB_SHA}"

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: ahmad-solution-erp-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
