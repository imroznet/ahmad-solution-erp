name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: asl_erp
          MYSQL_USER: asl
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: rootsecret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootsecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, gd, intl, mbstring, mysql, sqlite, xml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run tests
        run: php artisan test

      - name: Audit Composer dependencies
        run: composer audit

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # The runner image already has a MySQL client. Installing the mysql-client
      # package upgrades the host server, and that package's postinst fails
      # while the service container owns port 3306.
      - name: Install MySQL client and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip
          if ! command -v mysql >/dev/null 2>&1 || ! command -v mysqldump >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends mysql-client-core
          fi

      - name: Prove the MySQL schema and write the deployment SQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: asl_erp
          DB_USERNAME: asl
          DB_PASSWORD: secret
          APP_KEY: base64:s4p1vC2m0mN8oYk3qQh1wE7rT6uI5oP4aS3dF2gH1jK=
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction
          php artisan asl:export-access-sql
          php artisan asl:export-company-sql
          php artisan asl:export-parties-sql
          php artisan asl:export-quotations-sql
          php artisan asl:export-delivery-documents-sql
          php artisan asl:export-tax-sql
          php artisan asl:export-units-sql
          php artisan asl:export-quotation-self-approval-sql
          git diff --exit-code -- deploy/reference-data.sql deploy/company-reference-data.sql deploy/upgrade-company-module.sql deploy/upgrade-parties-module.sql deploy/upgrade-quotations-module.sql deploy/upgrade-delivery-documents-module.sql deploy/upgrade-tax-module.sql deploy/upgrade-units-module.sql deploy/upgrade-quotation-self-approval.sql
          cat > /tmp/mysql-client.cnf <<'EOF'
          [client]
          host=127.0.0.1
          port=3306
          user=asl
          password=secret
          EOF
          chmod 600 /tmp/mysql-client.cnf
          {
            echo "-- Generated by CI from the committed migrations."
            echo "-- Review before importing into phpMyAdmin. This file has no business data."
            echo "-- The migrations table is included so a later artisan migrate does not repeat this schema."
            mysqldump --defaults-extra-file=/tmp/mysql-client.cnf --no-tablespaces --skip-lock-tables --no-data asl_erp
            mysqldump --defaults-extra-file=/tmp/mysql-client.cnf --no-tablespaces --skip-lock-tables --no-create-info asl_erp migrations
          } > deploy/mysql-schema.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-company-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-parties-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-quotations-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-quotations-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-delivery-documents-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-delivery-documents-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-tax-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-tax-module.sql
          categories=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM document_categories" asl_erp)
          test "$categories" = "20"
          party_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Parties'" asl_erp)
          test "$party_permissions" = "10"
          sales_suppliers=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='suppliers.view'" asl_erp)
          test "$sales_suppliers" = "0"
          quotation_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Quotations'" asl_erp)
          test "$quotation_permissions" = "10"
          sales_self_approval=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-manager' AND p.slug='quotations.approve_own'" asl_erp)
          test "$sales_self_approval" = "0"
          super_self_approval=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='super-administrator' AND p.slug='quotations.approve_own'" asl_erp)
          test "$super_self_approval" = "1"
          challan_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Challans'" asl_erp)
          test "$challan_permissions" = "8"
          invoice_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Invoices'" asl_erp)
          test "$invoice_permissions" = "6"
          tax_rules=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Tax rules'" asl_erp)
          test "$tax_rules" = "5"
          mushak_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Mushak'" asl_erp)
          test "$mushak_permissions" = "6"
          vds_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='VDS'" asl_erp)
          test "$vds_permissions" = "4"
          ait_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='AIT'" asl_erp)
          test "$ait_permissions" = "4"
          unit_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Units'" asl_erp)
          test "$unit_permissions" = "2"
          sales_unit_manage=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='units.manage'" asl_erp)
          test "$sales_unit_manage" = "0"
          unit_rows=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM units" asl_erp)
          test "$unit_rows" = "14"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf -e "DELETE FROM units" asl_erp
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-units-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-units-module.sql
          unit_rows=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM units" asl_erp)
          test "$unit_rows" = "14"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-pdf-addresses.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-pdf-addresses.sql
          pdf_flag=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='asl_erp' AND TABLE_NAME='company_addresses' AND COLUMN_NAME='show_on_pdf'" )
          test "$pdf_flag" = "1"
          post_office=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='asl_erp' AND TABLE_NAME='party_addresses' AND COLUMN_NAME='post_office'" )
          test "$post_office" = "1"
          pdf_migration=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM migrations WHERE migration='2026_11_20_100001_add_pdf_address_columns'" asl_erp)
          test "$pdf_migration" = "1"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf -e "UPDATE public_site_controls SET maintenance_enabled = 1 WHERE id = 1" asl_erp
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-public-site.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-public-site.sql
          public_site_flag=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT maintenance_enabled FROM public_site_controls WHERE id = 1" asl_erp)
          test "$public_site_flag" = "1"
          public_site_permission=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE slug='public_site.manage'" asl_erp)
          test "$public_site_permission" = "1"
          public_site_rows=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM public_site_controls" asl_erp)
          test "$public_site_rows" = "1"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf -e "UPDATE public_site_controls SET contact_form_enabled = 0, recaptcha_enabled = 1 WHERE id = 1" asl_erp
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-public-site-contact.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-public-site-contact.sql
          contact_form=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT contact_form_enabled FROM public_site_controls WHERE id = 1" asl_erp)
          test "$contact_form" = "0"
          recaptcha_flag=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT recaptcha_enabled FROM public_site_controls WHERE id = 1" asl_erp)
          test "$recaptcha_flag" = "1"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf -e "UPDATE chart_of_accounts SET name = 'Petty cash renamed' WHERE system_key = 'cash'" asl_erp
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-accounting-phase-1.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-accounting-phase-1.sql
          cash_name=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT name FROM chart_of_accounts WHERE system_key = 'cash'" asl_erp)
          test "$cash_name" = "Petty cash renamed"
          system_accounts=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM chart_of_accounts WHERE system_key IS NOT NULL" asl_erp)
          test "$system_accounts" = "8"
          bank_rows=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM bank_accounts" asl_erp)
          test "$bank_rows" = "0"
          mfs_rows=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM mfs_accounts" asl_erp)
          test "$mfs_rows" = "0"
          accounting_permissions=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Accounting'" asl_erp)
          test "$accounting_permissions" = "12"
          manager_journals=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='accounts-manager' AND p.slug='journals.post'" asl_erp)
          test "$manager_journals" = "0"
          accountant_journals=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='accountant' AND p.slug='journals.post'" asl_erp)
          test "$accountant_journals" = "1"
          opened_on=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='asl_erp' AND TABLE_NAME='bank_accounts' AND COLUMN_NAME='opened_on'")
          test "$opened_on" = "1"
          admin_opening=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='administrator' AND p.slug='opening_balances.manage'" asl_erp)
          test "$admin_opening" = "1"
          accounting_migration=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM migrations WHERE migration='2026_11_21_100001_create_accounting_ledger'" asl_erp)
          test "$accounting_migration" = "1"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-accounting-phase-2.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-accounting-phase-2.sql
          receipt_permission=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE id=82 AND slug='receipts.create'" asl_erp)
          test "$receipt_permission" = "1"
          receipt_view=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE slug='receipts.view'" asl_erp)
          test "$receipt_view" = "0"
          accountant_receipts=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='accountant' AND p.slug='receipts.create'" asl_erp)
          test "$accountant_receipts" = "1"
          manager_receipts=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='accounts-manager' AND p.slug='receipts.create'" asl_erp)
          test "$manager_receipts" = "0"
          receipt_tables=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='asl_erp' AND TABLE_NAME IN ('receipts', 'receipt_allocations', 'receipt_number_sequences')")
          test "$receipt_tables" = "3"
          receipt_migration=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM migrations WHERE migration='2026_11_21_140001_create_accounting_receipts'" asl_erp)
          test "$receipt_migration" = "1"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-accounting-phase-3.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_erp < deploy/upgrade-accounting-phase-3.sql
          payment_permission=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE id=83 AND slug='payments.create'" asl_erp)
          test "$payment_permission" = "1"
          period_permission=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE id=86 AND slug='periods.manage'" asl_erp)
          test "$period_permission" = "1"
          payment_view=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE slug='payments.view'" asl_erp)
          test "$payment_view" = "0"
          accountant_payments=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='accountant' AND p.slug IN ('payments.create', 'periods.manage')" asl_erp)
          test "$accountant_payments" = "2"
          manager_payments=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='accounts-manager' AND p.slug IN ('payments.create', 'periods.manage')" asl_erp)
          test "$manager_payments" = "0"
          retained=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM chart_of_accounts WHERE system_key='retained_earnings' AND code='3000'" asl_erp)
          test "$retained" = "1"
          payment_tables=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='asl_erp' AND TABLE_NAME IN ('payments', 'payment_allocations', 'payment_number_sequences')")
          test "$payment_tables" = "3"
          payment_migration=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM migrations WHERE migration='2026_11_21_160001_create_accounting_payments'" asl_erp)
          test "$payment_migration" = "1"
          mysql -h 127.0.0.1 -P 3306 -uroot -prootsecret -e "CREATE DATABASE IF NOT EXISTS asl_upgrade CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON asl_upgrade.* TO 'asl'@'%'; FLUSH PRIVILEGES;"
          for path in database/migrations/*.php; do
            case "$(basename "$path")" in
              *party*|*quotation*|*delivery_document*|*tax*|*accounting*) continue ;;
            esac
            DB_DATABASE=asl_upgrade php artisan migrate --force --no-interaction --path="$path"
          done
          DB_DATABASE=asl_upgrade php artisan db:seed --force --no-interaction
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade <<'SQL'
          DELETE FROM permission_role WHERE permission_id IN (SELECT id FROM (SELECT id FROM permissions WHERE permission_group = 'Parties') AS party_permissions);
          DELETE FROM permissions WHERE permission_group = 'Parties';
          SQL
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-parties-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-parties-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-accounting-phase-1.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf -e "UPDATE chart_of_accounts SET name = 'Petty cash renamed' WHERE system_key = 'cash'" asl_upgrade
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-accounting-phase-1.sql
          upgrade_cash_name=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT name FROM chart_of_accounts WHERE system_key = 'cash'" asl_upgrade)
          test "$upgrade_cash_name" = "Petty cash renamed"
          upgrade_banks=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM bank_accounts" asl_upgrade)
          test "$upgrade_banks" = "0"
          upgrade_accounting_migration=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM migrations WHERE migration='2026_11_21_100001_create_accounting_ledger'" asl_upgrade)
          test "$upgrade_accounting_migration" = "1"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-pdf-addresses.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-pdf-addresses.sql
          upgrade_post_office=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='asl_upgrade' AND TABLE_NAME='party_addresses' AND COLUMN_NAME='post_office'" )
          test "$upgrade_post_office" = "1"
          upgraded=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE slug='parties.view'" asl_upgrade)
          test "$upgraded" = "1"
          upgraded_sales=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='customers.view'" asl_upgrade)
          test "$upgraded_sales" = "1"
          upgraded_blocked=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='suppliers.view'" asl_upgrade)
          test "$upgraded_blocked" = "0"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade <<'SQL'
          DELETE FROM permission_role WHERE permission_id IN (SELECT id FROM (SELECT id FROM permissions WHERE permission_group = 'Quotations') AS quotation_permissions);
          DELETE FROM permissions WHERE permission_group = 'Quotations';
          SQL
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-quotations-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-quotations-module.sql
          upgraded_quotations=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE slug='quotations.view'" asl_upgrade)
          test "$upgraded_quotations" = "1"
          upgraded_quotation_group=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Quotations'" asl_upgrade)
          test "$upgraded_quotation_group" = "10"
          upgraded_self_approval=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-manager' AND p.slug='quotations.approve_own'" asl_upgrade)
          test "$upgraded_self_approval" = "0"
          upgraded_super_self=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='super-administrator' AND p.slug='quotations.approve_own'" asl_upgrade)
          test "$upgraded_super_self" = "1"
          upgraded_sales_quotes=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='quotations.view'" asl_upgrade)
          test "$upgraded_sales_quotes" = "1"
          upgraded_sales_approve=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='sales-executive' AND p.slug='quotations.approve'" asl_upgrade)
          test "$upgraded_sales_approve" = "0"
          upgraded_documents=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permission_role pr JOIN roles r ON r.id = pr.role_id JOIN permissions p ON p.id = pr.permission_id WHERE r.slug='document-manager' AND p.slug='quotations.view'" asl_upgrade)
          test "$upgraded_documents" = "0"
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade <<'SQL'
          DELETE FROM permission_role WHERE permission_id IN (SELECT id FROM (SELECT id FROM permissions WHERE permission_group IN ('Challans', 'Invoices')) AS document_permissions);
          DELETE FROM permissions WHERE permission_group IN ('Challans', 'Invoices');
          SQL
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-delivery-documents-module.sql
          mysql --defaults-extra-file=/tmp/mysql-client.cnf asl_upgrade < deploy/upgrade-delivery-documents-module.sql
          upgraded_challans=$(mysql --defaults-extra-file=/tmp/mysql-client.cnf -N -e "SELECT COUNT(*) FROM permissions WHERE permission_group='Challans'" asl_upgrade)
          test "$upgraded_challans" = "8"
